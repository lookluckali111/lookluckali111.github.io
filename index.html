<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title id="page-title">خانه - Lookluck</title>
    <style>
        body { background-color: #1a1a1a; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; flex-direction: column; }
        .card { background: #2c2c2c; padding: 40px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); text-align: center; border: 1px solid #444; }
        button { background-color: #00d4ff; border: none; padding: 15px 30px; margin: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; color: #1a1a1a; font-size: 16px; transition: 0.3s; width: 240px; display: block;}
        button:hover { background-color: #0099bb; transform: scale(1.05); }
        
        /* استایل اختصاصی دکمه زبان */
        #btn-lang { background-color: #555; color: white; margin-top: 20px; font-size: 14px; padding: 10px; }
        #btn-lang:hover { background-color: #777; }
        
        h1 { margin-top: 0; color: #00d4ff; }
    </style>
</head>
<body>

    <div class="card">
        <h1 id="heading">به وب‌سایت Lookluck خوش آمدی</h1>
        <p id="description">یکی از محیط‌ها را انتخاب کن:</p>
        
        <button id="btn-test" onclick="window.location.href='test-site/index.html'">ورود به Test Site</button>
        <button id="btn-main" onclick="checkAccess()">ورود به AlmorsXD</button>
        
        <!-- دکمه تغییر زبان -->
        <button id="btn-lang" onclick="toggleLanguage()">EN / FA ⇄</button>
    </div>

    <script>
        const translations = {
            fa: {
                title: "خانه - Lookluck",
                heading: "به وب‌سایت Lookluck خوش آمدی",
                description: "یکی از محیط‌ها را انتخاب کن:",
                btnTest: "ورود به Test Site",
                btnMain: "ورود به AlmorsXD",
                btnLang: "EN / FA ⇄",
                promptUser: "نام کاربری را وارد کن:",
                promptPass: "رمز عبور را وارد کن:",
                errorMsg: "نام کاربری یا رمز عبور اشتباه است!"
            },
            en: {
                title: "Home - Lookluck",
                heading: "Welcome to Lookluck Website",
                description: "Choose one of the environments:",
                btnTest: "Enter Test Site",
                btnMain: "Enter AlmorsXD",
                btnLang: "EN / FA ⇄",
                promptUser: "Enter username:",
                promptPass: "Enter password:",
                errorMsg: "Invalid username or password!"
            }
        };

        // دریافت زبان ذخیره شده یا تشخیص زبان مرورگر
        let currentLang = localStorage.getItem('userLang') || (navigator.language.startsWith('fa') ? 'fa' : 'en');

        function updateUI() {
            const t = translations[currentLang];
            document.documentElement.lang = currentLang;
            document.documentElement.dir = (currentLang === 'fa') ? 'rtl' : 'ltr';
            
            document.getElementById('page-title').innerText = t.title;
            document.getElementById('heading').innerText = t.heading;
            document.getElementById('description').innerText = t.description;
            document.getElementById('btn-test').innerText = t.btnTest;
            document.getElementById('btn-main').innerText = t.btnMain;
            document.getElementById('btn-lang').innerText = t.btnLang;
        }

        function toggleLanguage() {
            currentLang = (currentLang === 'fa') ? 'en' : 'fa';
            localStorage.setItem('userLang', currentLang); // ذخیره در مرورگر
            updateUI();
        }

        function checkAccess() {
            const t = translations[currentLang];
            const users = [
                { user: "ali", pass: "lookluck" },
                { user: "almorsxd", pass: "666" },
                { user: "arsalan", pass: "1393" },
                { user: "admin", pass: "1234" }
            ];

            const inputUser = prompt(t.promptUser);
            const inputPass = prompt(t.promptPass);

            const isValid = users.some(u => u.user === inputUser && u.pass === inputPass);

            if (isValid) {
                window.location.href = "almorsxd-site/index.html";
            } else {
                alert(t.errorMsg);
            }
        }

        // فراخوانی اولیه برای نمایش درست صفحه
        updateUI();
    </script>
</body>
</html>
